<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Alpha opening — EulerBridgeMark</title>
<style>
:root{color-scheme:dark;--sky:#8bafd3;--brass:#79cbe8;--void:#07121e}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:var(--void);font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;user-select:none}
#stage{position:fixed;inset:0;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse 84% 78% at 50% 48%,#0c1b2b 0%,#081624 64%,#06111d 100%)}
#art{width:100%;height:100%;display:block}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 92% at 50% 48%,transparent 60%,rgba(0,0,0,.16) 100%)}
#points{fill:#c0d1df;opacity:.55;}
#discs .disc{fill:#75a6c5;fill-opacity:.10;stroke:#a4c0d2;stroke-width:.42;stroke-opacity:.27;}
.mesh-edge{fill:none;stroke:#819fb7;stroke-width:.72;stroke-opacity:.40;stroke-linecap:round;vector-effect:non-scaling-stroke}
.mesh-face{fill:#9bb8ca;fill-opacity:.065;stroke:none}
.transient{fill:none;stroke:#79cbe8;stroke-width:1.35;opacity:0;stroke-linejoin:round;stroke-linecap:round}
.local-edge{fill:none;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round;opacity:0;vector-effect:non-scaling-stroke}
.route{fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;opacity:0;vector-effect:non-scaling-stroke}
#route-particles{fill:#d8e9f0;opacity:0;}
#brand-group{opacity:0;}
#brand-glow{opacity:.0;filter:url(#blur);}
#brand-paths path{paint-order:stroke;}
#brand-nodes{opacity:0}
#caption{position:absolute;left:32px;top:28px;z-index:3;pointer-events:none;color:#99b1c8;letter-spacing:.18em;font-size:10px;text-transform:uppercase;opacity:.65;transition:opacity .2s}
#caption .tiny{letter-spacing:.32em;font-size:9px;opacity:.6;margin-bottom:10px}
#caption span{color:var(--brass)}
#clocktag{position:absolute;right:35px;bottom:27px;z-index:3;pointer-events:none;color:#99b1c8;letter-spacing:.18em;font-size:9px;opacity:.32;}
#bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:13px;color:#aabed0;background:rgba(6,16,28,.66);border:1px solid rgba(140,170,202,.1);border-radius:8px;padding:9px 12px;width:min(420px,calc(100% - 48px));opacity:.18;transition:opacity .2s;backdrop-filter:blur(8px)}
#stage:hover #bar,#bar:focus-within{opacity:1}
#bar button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;min-width:28px;padding:4px;}
#bar input{flex:1;min-width:40px;height:13px;accent-color:var(--brass)}
#bar output{font-size:9px;min-width:45px;text-align:right}
#bar button:focus-visible{outline:1px solid var(--brass)}
@media(max-width:700px){#caption{left:18px;top:15px;transform:scale(.8);transform-origin:top left}#clocktag{right:18px;bottom:80px}#bar{opacity:.8}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* V6: continuous local geometric condensation, NOT an outline on an empty screen. */
.native-near{fill:none;stroke-width:1.0;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:0}
.organic-thread{fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:0}
.native-particle{opacity:0}
#brand-group{opacity:0}
#brand-glow{opacity:0;filter:url(#blur)}
#brand-paths path{stroke-width:2.1}
#route-particles{opacity:1}
#local-mesh{opacity:1}
#routes{opacity:1}

#bar,#caption,#clocktag{display:none!important}\n</style>
</head>

const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));

const at=(p,s,e)=>smooth((p-s)/(e-s));
const edges=Array.from(document.querySelectorAll('.mesh-edge'));
const faces=Array.from(document.querySelectorAll('.mesh-face'));
const trcycles=Array.from(document.querySelectorAll('.transient'));
const discs=Array.from(document.querySelectorAll('.disc'));
const near=Array.from(document.querySelectorAll('.native-near'));

const moving=Array.from(document.querySelectorAll('.native-particle'));

const brandPaths=Array.from(document.querySelectorAll('#brand-paths path'));
const glows=Array.from(document.querySelectorAll('#brand-glow path'));
const fmt=(x)=>x.toFixed(2);
function render(p){
 p=clamp(p);
 const alpha=data.rStop*at(p,.045,.54);
 const faceExit=1-at(p,.54,.695);
 const meshExit=1-at(p,.61,.91);
 const pointExit=1-at(p,.665,.96);
 // Alpha expansion and authentic one-dimensional deaths remain unchanged.
 for(const e of edges){let r=+e.dataset.alpha;let on=smooth((alpha-r+1.35)/3.3);e.style.opacity=fmt(on*meshExit*.72)}
 for(const e of faces){let r=+e.dataset.alpha;let on=smooth((alpha-r+2)/4.3);e.style.opacity=fmt(on*faceExit*.86)}
 for(const e of trcycles){let born=at(alpha,+e.dataset.b-1,+e.dataset.b+1.2),died=at(alpha,+e.dataset.d-1,+e.dataset.d+1.2);e.style.opacity=fmt(born*(1-died)*faceExit*.43)}
 $('discs').style.opacity=fmt(.69*(1-at(p,.35,.60)));
 if(p<.615)for(const e of discs)e.setAttribute('r',fmt(alpha));
 $('points').style.opacity=fmt(.54*pointExit);
 // Neighboring genuine Delaunay edges are the intermediate visual; they already
 // exist in the Alpha mesh. Highlight nearby tangent-aligned edges as the
 // extraneous network dissolves, first broad, then very close to the glyph.
 const strengthen=at(p,.55,.755);
 const thin=at(p,.735,.915);
 for(const e of near){
  const band=+e.dataset.band;
  const keep=1-at(thin,.06+Math.max(0,(3-band))*.09,.48+Math.max(0,(3-band))*.08);
  const weight= Math.max(.0,1-band*.10);
  const atten=(1-at(p,.815,.976))*.9;
  e.style.opacity=fmt(strengthen*keep*weight*atten);
 }
 // Each filament starts <=13px from its exact source curve.

 const f=at(p,.725,.945);
 const emerge=at(p,.665,.835);
 const handoff=at(p,.865,.985);
