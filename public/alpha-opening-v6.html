<script>
(()=>{'use strict';
const DURATION=7400;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const at=(p,s,e)=>smooth((p-s)/(e-s));
// Precomputed from the displayed point coordinates, without radius buckets:
// triangles enter at their empty circumradius; Gabriel edges at half-length;
// other Delaunay edges inherit the smallest incident triangle circumradius.
const faces=Array.from(document.querySelectorAll('#faces .mesh-face'),node=>({
 node,birth:Number(node.dataset.alpha),last:-1
}));
const edges=Array.from(document.querySelectorAll('#edges .mesh-edge'),node=>({
 node,birth:Number(node.dataset.alpha),last:-1
}));
const points=Array.from(document.querySelectorAll('#points circle'),node=>({node,last:-1}));
const geometry={node:document.getElementById('geometry'),last:-1};
// The 64-unit guard band lies outside every slice of the viewBox. All triangles
// intersecting that viewBox have circumradius <= 38.23; 40 fills it completely.
const radius=40;
let elapsed=0,previous=null;
let alpha=0;
const setOpacity=(item,value)=>{
 const next=Math.round(clamp(value)*1000)/1000;
 if(next!==item.last){item.node.style.opacity=String(next);item.last=next}
};
function render(p){
 p=clamp(p);
 // Continue the same forward filtration through the second half: cycles die
 // when triangles fill them. Never lower alpha to remove simplices.
 alpha=radius*at(p,.015,.88);
 for(const face of faces)setOpacity(face,.92*smooth((alpha-face.birth)/.7));
 for(const edge of edges)setOpacity(edge,.87*smooth((alpha-edge.birth)/.7));
 for(const point of points)setOpacity(point,.67*at(p,0,.045));
 // Exit is a fade of the entire completed complex, not a second filtration.
 setOpacity(geometry,1-at(p,.91,.993));
}
function tick(now){if(previous===null)previous=now;elapsed=Math.min(DURATION,elapsed+Math.max(0,now-previous));render(elapsed/DURATION);previous=now;if(elapsed===DURATION){if(window.parent!==window)window.parent.postMessage({type:'alpha-splash:complete'},window.location.origin);return;}requestAnimationFrame(tick)}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){
 render(1);
 if(window.parent!==window)window.parent.postMessage({type:'alpha-splash:complete'},window.location.origin);
}else{
 render(0);
 requestAnimationFrame(tick);
}
window.__alphaSplash={seek(p){render(p)},get state(){return {elapsed,alpha,opacity:geometry.last,triangleCount:faces.length,activeTriangles:faces.filter(x=>x.birth<=alpha).length,visibleTriangles:geometry.last>0?faces.filter(x=>x.last>0).length:0,visiblePoints:geometry.last>0?points.filter(x=>x.last>0).length:0}}};
})();
</script>
